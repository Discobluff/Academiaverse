stages:
  - build
  - static_analysis
  - test
  - deploy

build:backend:
  stage: build
  image: gradle:8-jdk21
  script:
    - ./gradlew build
  before_script:
    - cd src/backend
    - chmod +x gradlew

build:frontend:
  stage: build
  image: node:trixie
  script:
    - npm ci
    - npx ng build
  before_script:
    - cd src/frontend

static_analysis:backend:
  stage: static_analysis
  image: gradle:8-jdk21
  script:
    - ./gradlew check -x test
  before_script:
    - cd src/backend
    - chmod +x gradlew

static_analysis:frontend:
  stage: static_analysis
  image: node:trixie
  script:
    - npm ci
    - npx ng lint
  before_script:
    - cd src/frontend

test:frontend:
  stage: test
  image: node:trixie
  script:
    - npm ci
    - npx ng test
  before_script:
    - cd src/frontend

test:backend:
  stage: test
  image: gradle:8-jdk21
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: mydb
    MYSQL_USER: myuser
    MYSQL_PASSWORD: pwd
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mydb?allowPublicKeyRetrieval=true&useSSL=false
    SPRING_DATASOURCE_USERNAME: myuser
    SPRING_DATASOURCE_PASSWORD: pwd
  cache:
    key: backend-$CI_COMMIT_REF_SLUG
    paths:
      - backend/.gradle/
  before_script:
    - cd src/backend
    - chmod +x gradlew
  script:
    - ./gradlew test

deploy:backend:
  stage: deploy
  image: gradle:8-jdk21
    before_script:
    - cd src/backend
    - chmod +x gradlew
  script:
    - ./gradlew bootJar
    - echo "Deploying backend..."
    - echo "JAR file ready at backend/build/libs/"
    - ls backend/build/libs/
    - echo "Backend deployed successfully ✅"

deploy:frontend:
  stage: deploy
  image: node:trixie
  script:
    - npm ci
    - npx ng build --configuration production
    - echo "Deploying frontend..."
    - echo "Build files ready at frontend/dist/"
    - ls frontend/dist/
    - echo "Frontend deployed successfully ✅"
  before_script:
    - cd src/frontend