plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id "checkstyle"
    id "pmd"
    id "com.github.spotbugs" version "6.5.1"
    id "org.owasp.dependencycheck" version "12.2.1"
	id 'jacoco'
    // id 'org.barfuin.gradle.jacocolog' version '4.0.2'
}

group = 'com.academiaverse'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

jacoco {
    toolVersion = "0.8.14"
}

test {
    finalizedBy jacocoTestReport
	testLogging {
        events "passed", "skipped", "failed"
        showExceptions = true
        showCauses = true
        showStackTraces = true
        exceptionFormat = "full"
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

//--- Checkstyle ---
checkstyle {
    toolVersion = "13.4.0"
    configFile = file("config/checkstyle/checkstyle.xml")
    ignoreFailures = true
}

// --- PMD ---
pmd {
    toolVersion = "7.23.0"
    ignoreFailures = false
    ruleSets = ["category/java/bestpractices.xml", "category/java/errorprone.xml"]
}

// --- SpotBugs ---
spotbugs {
    toolVersion = "4.9.7"
    effort = com.github.spotbugs.snom.Effort.valueOf("MAX")
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf("LOW")
    ignoreFailures = false
	excludeFilter = file("config/spotbugs/exclude.xml")
}

spotbugsMain {
    reports {
        html { required = true }
        xml { required = false }
    }
}

// --- OWASP ---
dependencyCheck {
    failBuildOnCVSS = 7  // fail on high severity CVEs
    format = "HTML"
}
