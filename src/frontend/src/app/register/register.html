<div class="login-panel">
    <input i18n-placeholder="@@translation_firstname" class="login-input" placeholder="Firstname" [(ngModel)]="firstname">
    <input i18n-placeholder="@@translation_lastname" class="login-input" placeholder="Lastname" [(ngModel)]="lastname">
    <input i18n-placeholder="@@translation_email" class="login-input" placeholder="Email" [(ngModel)]="email">
    <input i18n-placeholder="@@translation_password" class="login-input" type="password" placeholder="Password" [(ngModel)]="password">
    <input i18n-placeholder="@@translation_password_confirmation" class="login-input" type="password" placeholder="Password confirmation" [(ngModel)]="passwordConfirmation">

    <!-- Terms of Service checkbox -->
    <label class="terms-label">
        <input type="checkbox" [(ngModel)]="acceptedTerms">
        <span i18n="@@translation_read_accept">I have read & accept the </span>
        <a href="/terms" i18n="@@translation_terms" target="_blank">terms of service</a>
    </label>

    <button i18n="@@translation_register" class="login-button" (click)="register()" >Register</button>

    @if (errorMessage !== "") {
        <p class="error-message">{{ errorMessage }}</p>
    }
</div>
