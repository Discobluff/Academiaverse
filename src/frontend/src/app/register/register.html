<div class="login-panel">
    <input class="login-input" placeholder="Firstname" [(ngModel)]="firstname">
    <input class="login-input" placeholder="Lastname" [(ngModel)]="lastname">
    <input class="login-input" placeholder="Email" [(ngModel)]="email">
    <input class="login-input" type="password" placeholder="Password" [(ngModel)]="password">
    <input class="login-input" type="password" placeholder="Password confirmation" [(ngModel)]="passwordConfirmation">

    <!-- Terms of Service checkbox -->
    <label class="terms-label">
        <input type="checkbox" [(ngModel)]="acceptedTerms">
        I have read & accept the <a href="/terms" target="_blank">terms of service</a>
    </label>

    <button class="login-button" (click)="register()" >Register</button>

    @if (errorMessage !== "") {
        <p class="error-message">{{ errorMessage }}</p>
    }
</div>
