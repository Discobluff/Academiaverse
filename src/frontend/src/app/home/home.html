@if (!authService.isAuthenticated()){
    <button (click)="clickLogin()">Login</button>
    <button (click)="clickRegister()">Register</button>
}
@else {
    <button (click)="clickLogout()">Logout</button>
    <button (click)="clickSearch()">Search Courses</button>
    <button (click)="clickAddItem()">Add Item</button>
}

@if (authService.isAuthenticated()){
    <p>You are logged in!</p>
    <p>User email : {{email}}</p>
}
@else {
    <p>You are logged out!</p>
}

@if (hasAdminRole()) {
    <p>You are admin, admin message: {{admin}}</p>
}
