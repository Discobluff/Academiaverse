<div class="listings-container">
    <h2 i18n="@@translation_seller_listings">Seller Listings</h2>
    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Type</th>
                <th>Status</th>
                <th>Payment</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            @for (item of items; track item) {
            <tr>
                <td>{{ item.title }}</td>
                <td>{{ item.price }} {{ item.paymentMethod === 'points' ? 'points' : '€' }}</td>
                <td>{{ item.type }}</td>
                <td>{{ item.availability || item.status || 'Available' }}</td>
                <td>{{ item.paymentMethod }}</td>
                <td>
                    <button class="view-btn" (click)="viewItem(item.id)">View</button>
                    <button class="edit-btn" (click)="editItem(item.id)">Edit</button>
                    <button class="delete-btn" (click)="deleteItem(item.id)">Delete</button>
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>
