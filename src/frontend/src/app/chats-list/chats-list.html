<div class="chats-container">
  <h2>My Chats</h2>

  @if (conversations.length === 0) {
    <p class="no-chats">You haven't chatted about any items yet.</p>
  }

  <div class="chats-list">
    @for (conv of conversations; track conv.itemId + '-' + conv.buyerId) {
      <div class="chat-card" tabindex="0" role="button"
           (click)="openChat(conv.itemId, conv.buyerId)"
           (keydown.enter)="openChat(conv.itemId, conv.buyerId)">
        <h3>{{ conv.itemTitle }}</h3>
        <p>Buyer: {{ conv.buyerName }}</p>
      </div>
    }
  </div>
</div>
