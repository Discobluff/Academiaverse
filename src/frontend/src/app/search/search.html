<div>
  <input list="courseSuggestions" [(ngModel)]="query" (input)="onInput()" (keyup.enter)="search()" placeholder="Search courses..." />
  <datalist id="courseSuggestions">
    <option *ngFor="let suggestion of suggestions" [value]="suggestion"></option>
  </datalist>
  <button (click)="search()">Search</button>

  <div *ngIf="authService.isAuthenticated() && recentSearches.length">
    <h4>Recent searches:</h4>
    <ul>
      <li *ngFor="let item of recentSearches">
        <a href="#" (click)="useRecentSearch(item); $event.preventDefault()">{{ item }}</a>
      </li>
    </ul>
  </div>

  <ul>
    <li *ngFor="let course of results">{{ course.name }} ({{ course.code }})</li>
  </ul>
</div>
