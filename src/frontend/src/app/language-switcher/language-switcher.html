<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<div class="dropdown" (clickOutside)="isOpen = false">
    <button class="dropdown-toggle" type="button" (click)="isOpen = !isOpen">
        <mat-icon>language</mat-icon>
    </button>
    <ul class="dropdown-menu" [class.show]="isOpen"
        [ngStyle]="currentLocale === 'en-US' ? {'right': '0'} : {'left': '0'}"
        >
        <li>
            <button class="dropdown-item" [class.active]="currentLocale === 'en-US'" (click)="switchLanguage('en-US')">
                🇺🇸 English
            </button>
        </li>
        <li>
            <button class="dropdown-item" [class.active]="currentLocale === 'ar'" (click)="switchLanguage('ar')">
                🇸🇦 العربية
            </button>
        </li>
    </ul>
</div>
