<h2>Edit Item</h2>
<form (ngSubmit)="onSubmit()">
  <p>Title:</p>
  <input [(ngModel)]="item.title" name="title" required />

  <p>Description:</p>
  <textarea [(ngModel)]="item.description" name="description"></textarea>

  <p>Notes:</p>
  <textarea [(ngModel)]="item.notes" name="notes"></textarea>

  <p>Payment Method:</p>
  <select [(ngModel)]="item.paymentMethod" name="paymentMethod">
    <option value="cash">Cash</option>
    <option value="points">Points</option>
  </select>

  <p>Price ({{ item.paymentMethod === 'points' ? 'points' : '€' }}):</p>
  <input type="number" [(ngModel)]="item.price" name="price" required />

  <p>Type:</p>
  <select [(ngModel)]="item.type" name="type">
    <option value="sale">For Sale</option>
    <option value="rent">For Rent</option>
  </select>

  @if (!isFormValid()) {
    <p class="error-message">Please fill in a title and a price.</p>
  }

  <button type="submit" [disabled]="!isFormValid()">Save Changes</button>
</form>
